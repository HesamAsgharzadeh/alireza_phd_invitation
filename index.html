<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کارت دعوت دفاع از رساله دکتری</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #020b18 0%, #081b2d 50%, #031324 100%);
      font-family: Tahoma, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }
    .card-container {
      max-width: 400px; /* سایز کادر و عکس بزرگ‌تر شد */
      width: 100%;
      text-align: center;
      background: rgba(8, 24, 41, 0.95);
      padding: 20px;
      border: 2px solid #00d2ff;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0, 210, 255, 0.25);
      box-sizing: border-box;
    }
    .card-image {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      margin-bottom: 18px;
    }
    .action-section {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .button {
      display: inline-block;
      padding: 12px 20px;
      background: linear-gradient(135deg, #0072ff 0%, #00d2ff 100%);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
      transition: all 0.3s ease;
    }
    .button:hover {
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5);
    }
    .qr-container {
      margin-top: 10px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      display: inline-block;
      align-self: center;
    }
    .qr-container img {
      width: 130px;
      height: 130px;
      display: block;
    }
    .qr-text {
      color: #00d2ff;
      font-size: 13px;
      margin-top: 8px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <main class="card-container">
    <!-- عکس کارت دعوت شما -->
    <img src="invitation.jpg" alt="کارت دعوت دفاع دکتری" class="card-image">
    
    <div class="action-section">
      <!-- دکمه موقعیت مکانی حضوری -->
      <a class="button" href="https://nshn.ir/0e_bvXHHVxOsvv" target="_blank" rel="noopener">
         مشاهده موقعیت مکانی در نقشه (حضوری)
      </a>

      <!-- دکمه ورود به جلسه آنلاین -->
      <a class="button" href="https://meet.google.com/dcq-qhwi-rnb" target="_blank" rel="noopener">
         ورود به جلسه آنلاین (مجازی)
      </a>

      <!-- بخش QR Code برای اسکن سریع لینک آنلاین -->
      <div class="qr-container">
        <!-- ساخت خودکار QR Code بر اساس لینک جلسه آنلاین شما -->
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://meet.google.com/dcq-qhwi-rnb" alt="QR Code جلسه آنلاین">
      </div>
      <p class="qr-text">اسکن جهت ورود به جلسه آنلاین</p>
    </div>
  </main>

</body>
</html>
